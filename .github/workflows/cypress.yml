name: Cypress E2E

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    # Fail fast if a step hangs (e.g. a stuck npm ci) instead of waiting for the 6-hour default
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Start and wait for the dev server ourselves: the action's built-in
      # start/wait-on fails immediately on the Node 24 Actions runtime with
      # "Socket closed before the connection was established".
      # 127.0.0.1 avoids localhost resolving to IPv6 (::1) while Vite listens on IPv4.
      - name: Start dev server
        run: npm run dev -- --port 5173 --strictPort > vite.log 2>&1 &

      - name: Wait for dev server
        run: npx --yes wait-on@8 --timeout 60000 http://127.0.0.1:5173

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          config: baseUrl=http://127.0.0.1:5173

      - name: Dev server log
        if: failure()
        run: cat vite.log
